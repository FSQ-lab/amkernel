[project]
name = "amkernel"
version = "0.0.0"
description = "Persistent Python execution for agentic automation."
readme = "README.md"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
amkernel = "amkernel.cli:main"

[dependency-groups]
dev = [
    "coverage[toml]>=7.17,<8",
    "mypy>=2.4,<3",
    "psutil>=7.2.2,<8",
    "types-psutil>=7.2.2.20260906,<8",
    "pytest>=9.2,<10",
    "ruff>=0.17.3,<0.18",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.5,<0.13"
environments = [
    "python_version >= '3.11' and python_version < '3.15'",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["amkernel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
